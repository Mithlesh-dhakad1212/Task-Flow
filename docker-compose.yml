# One-command local stack:  docker compose up --build
#   Web  → http://localhost:3000   (demo: demo@taskflow.dev / Password123!)
#   API  → http://localhost:4000/api   Swagger → http://localhost:4000/api/docs
#   DB   → localhost:5433 (taskflow / taskflow) — change with DB_PORT if 5433 is taken
#
# Secrets below are local-development defaults only. Override them with a
# `.env` file next to this one (see .env.example) for anything shared.

name: taskflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      # Host port is configurable in case 5433 is already in use (e.g. DB_PORT=5544).
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-only-secret-change-me-0123456789abcdef}
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - '4000:4000'

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      # The browser talks to the web app's own /api proxy, which forwards to the API service.
      API_PROXY_TARGET: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  pgdata:
