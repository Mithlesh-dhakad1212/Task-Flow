name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, typecheck, unit + e2e tests (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 16 = local Docker Compose; 18 (Debian) = what the Railway deployment runs.
        # Testing both caught a production-only bug (timezone aliases missing on Debian 13).
        postgres: ['16-alpine', '18']
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci

  frontend:
    name: Frontend · lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  e2e-stack:
    name: Full stack · Docker Compose + API smoke test (Newman)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start the stack (db → api → web, waits for health checks)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Web app serves the login page
        run: curl --fail --silent --show-error http://localhost:3000/login > /dev/null
      - name: Swagger docs are served
        run: curl --fail --silent --show-error http://localhost:4000/api/docs > /dev/null
      - name: Run the Postman collection against the running API
        run: npx --yes newman@6 run docs/taskflow.postman_collection.json --bail --reporters cli
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
